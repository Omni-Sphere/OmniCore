name: CD - OmniSphere SDK (Core Library)

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: omnisphere-sdk-deploy
  cancel-in-progress: true

jobs:
  deploy-sdk:
    name: Rebuild SDK Base & Deploy API (main)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Rebuild SDK Base Image & Deploy via SSH (Key Auth Only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '2202' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "=================================================="
            echo " Rebuilding SDK Base Image for Branch: main"
            echo "=================================================="

            SDK_DIR="$(git rev-parse --show-show-toplevel 2>/dev/null || pwd)"
            PROJECTS_DIR="$(cd "$SDK_DIR/.." 2>/dev/null && pwd)"

            cd "$PROJECTS_DIR"

            SQL_CHANGED=false
            echo "--> Pulling latest changes in all SDK library repositories..."
            for d in OmniUtils OmniData OmniCore OmniERP OmniRoute OmniGraph; do
              if [ -d "$PROJECTS_DIR/$d/.git" ]; then
                cd "$PROJECTS_DIR/$d"
                PREV_HEAD=$(git rev-parse HEAD 2>/dev/null || echo "")
                (git checkout main 2>/dev/null || git checkout master 2>/dev/null || true)
                git pull origin $(git branch --show-current 2>/dev/null || echo "main") 2>/dev/null || true
                NEW_HEAD=$(git rev-parse HEAD 2>/dev/null || echo "")

                if [ "$d" == "OmniGraph" ] && [ -n "$PREV_HEAD" ] && [ -n "$NEW_HEAD" ] && [ "$PREV_HEAD" != "$NEW_HEAD" ]; then
                  if git diff --name-only "$PREV_HEAD" "$NEW_HEAD" | grep -q "OmniRoute.sql"; then
                    SQL_CHANGED=true
                  fi
                fi
              fi
            done

            cd "$PROJECTS_DIR"

            echo "=================================================="
            echo " 1. Checking Database Schema Migrations (OmniRoute.sql)"
            echo "=================================================="
            SQL_FILE="$PROJECTS_DIR/OmniGraph/GraphQL/Route/OmniRoute.sql"
            if [ "$SQL_CHANGED" = true ]; then
              echo "--> Changes detected in OmniRoute.sql! Applying migration to omniroute-db-dev..."
              if [ -f "$SQL_FILE" ] && podman container exists omniroute-db-dev 2>/dev/null; then
                podman exec -i omniroute-db-dev psql -U system -d OmniRoute < "$SQL_FILE" || true
              else
                echo "--> Warning: SQL file or omniroute-db-dev container not found, skipping migration."
              fi
            else
              echo "--> No changes detected in OmniRoute.sql. Skipping DB schema migration."
            fi

            echo "=================================================="
            echo " 2. Rebuilding Base SDK Image (localhost/omnisphere-sdk:latest)"
            echo "=================================================="
            if [ -f "$PROJECTS_DIR/Dockerfile" ]; then
              podman build -t localhost/omnisphere-sdk:latest -f "$PROJECTS_DIR/Dockerfile" "$PROJECTS_DIR"
            elif [ -f "$SDK_DIR/Dockerfile" ]; then
              podman build -t localhost/omnisphere-sdk:latest -f "$SDK_DIR/Dockerfile" "$SDK_DIR"
            fi
            podman tag localhost/omnisphere-sdk:latest omnisphere-sdk:latest || true

            echo "=================================================="
            echo " 3. Rebuilding OmniRouteAPI Image (omniroute-api:test)"
            echo "=================================================="
            if [ -d "$PROJECTS_DIR/OmniRouteAPI" ]; then
              cd "$PROJECTS_DIR/OmniRouteAPI"
              if [ -f "Dockerfile.test" ]; then
                podman build -t omniroute-api:test -f Dockerfile.test .
              else
                podman build -t omniroute-api:test -f Dockerfile .
              fi
              podman tag omniroute-api:test omniroute-api-dev:latest 2>/dev/null || true
            fi

            echo "=================================================="
            echo " 4. Restarting Container (omniroute-api-dev) & Nginx Proxy"
            echo "=================================================="
            (podman restart omniroute-api-dev || podman restart omniroute-api || true)
            (podman restart nginx-proxy || true)

            echo "=================================================="
            echo " SDK & OmniRouteAPI Deployment Complete!"
            echo "=================================================="
